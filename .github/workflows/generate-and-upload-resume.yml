name: Generate & Upload Resume PDF

on:
  push:
    branches:
      - main
    paths:
      - "Mantu_CV.yaml"
  schedule:
    # Every Sunday at 11:30 PM IST (18:00 UTC)
    - cron: "0 18 * * 0"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          pip install "rendercv[full]"
          pip install google-api-python-client google-auth

      - name: Update npm download stats
        run: python3 scripts/update_npm_stats.py Mantu_CV.yaml

      - name: Generate Resume PDF
        run: rendercv render Mantu_CV.yaml

      - name: Upload to Google Drive
        env:
          GOOGLE_DRIVE_CREDENTIALS: ${{ secrets.GOOGLE_DRIVE_CREDENTIALS }}
          GOOGLE_DRIVE_FILE_ID: ${{ secrets.GOOGLE_DRIVE_FILE_ID }}
          GOOGLE_DRIVE_FOLDER_ID: ${{ secrets.GOOGLE_DRIVE_FOLDER_ID }}
        run: python3 scripts/upload_to_drive.py rendercv_output/Mantu_CV.pdf

      - name: Upload PDF artifact
        uses: actions/upload-artifact@v4
        with:
          name: resume-pdf
          path: rendercv_output/Mantu_CV.pdf

      - name: Commit generated files
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add rendercv_output/
          git diff --staged --quiet || git commit -m "chore: auto-generate resume PDF"
          git push

      - name: Send Telegram Notification
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          DRIVE_FILE_ID: ${{ secrets.GOOGLE_DRIVE_FILE_ID }}
          REPO: ${{ github.repository }}
          COMMIT_SHA: ${{ github.sha }}
          ACTOR: ${{ github.actor }}
        run: python3 scripts/notify_telegram.py
