name: Generate & Upload Resume PDF

on:
  push:
    branches:
      - main
    paths:
      - "Mantu_CV.yaml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          pip install "rendercv[full]"
          pip install google-api-python-client google-auth

      - name: Update npm download stats
        run: python3 scripts/update_npm_stats.py Mantu_CV.yaml

      - name: Generate Resume PDF
        run: rendercv render Mantu_CV.yaml

      - name: Upload to Google Drive
        env:
          GOOGLE_DRIVE_CREDENTIALS: ${{ secrets.GOOGLE_DRIVE_CREDENTIALS }}
          GOOGLE_DRIVE_FILE_ID: ${{ secrets.GOOGLE_DRIVE_FILE_ID }}
          GOOGLE_DRIVE_FOLDER_ID: ${{ secrets.GOOGLE_DRIVE_FOLDER_ID }}
        run: |
          python << 'EOF'
          import os
          import json
          import sys
          from google.oauth2 import service_account
          from googleapiclient.discovery import build
          from googleapiclient.http import MediaFileUpload
          from googleapiclient.errors import HttpError

          # Load credentials from environment
          creds_json = os.environ['GOOGLE_DRIVE_CREDENTIALS']
          creds_dict = json.loads(creds_json)

          # Print service account email for debugging
          service_email = creds_dict.get('client_email', 'unknown')
          print(f"🔑 Using service account: {service_email}")

          credentials = service_account.Credentials.from_service_account_info(
              creds_dict,
              scopes=['https://www.googleapis.com/auth/drive']  # Full Drive access
          )

          service = build('drive', 'v3', credentials=credentials)

          file_id = os.environ.get('GOOGLE_DRIVE_FILE_ID')
          folder_id = os.environ.get('GOOGLE_DRIVE_FOLDER_ID')
          file_path = 'rendercv_output/Mantu_CV.pdf'

          media = MediaFileUpload(file_path, mimetype='application/pdf', resumable=True)

          try:
              if file_id:
                  # UPDATE existing file (keeps same link!)
                  file = service.files().update(
                      fileId=file_id,
                      media_body=media
                  ).execute()
                  print(f"✅ Updated existing file: https://drive.google.com/file/d/{file_id}/view")
              else:
                  # CREATE new file (first time only)
                  file_metadata = {
                      'name': 'Mantu_CV.pdf',
                      'parents': [folder_id]
                  }
                  file = service.files().create(
                      body=file_metadata,
                      media_body=media,
                      fields='id'
                  ).execute()
                  new_file_id = file.get('id')
                  
                  # Make it publicly accessible
                  service.permissions().create(
                      fileId=new_file_id,
                      body={'type': 'anyone', 'role': 'reader'}
                  ).execute()
                  
                  print(f"✅ Created new file! Add this FILE_ID to GitHub secrets: {new_file_id}")
                  print(f"📎 Shareable link: https://drive.google.com/file/d/{new_file_id}/view")
          except HttpError as e:
              if e.resp.status == 404:
                  print(f"❌ ERROR: File not found (ID: {file_id})")
                  print(f"")
                  print(f"🔧 FIX: Share the file with your service account:")
                  print(f"   1. Go to Google Drive")
                  print(f"   2. Right-click on Mantu_CV.pdf → Share")
                  print(f"   3. Add: {service_email}")
                  print(f"   4. Give 'Editor' permission")
                  print(f"   5. Re-run this workflow")
                  sys.exit(1)
              else:
                  raise
          EOF

      - name: Upload PDF artifact
        uses: actions/upload-artifact@v4
        with:
          name: resume-pdf
          path: rendercv_output/Mantu_CV.pdf

      - name: Commit generated files
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add rendercv_output/
          git diff --staged --quiet || git commit -m "chore: auto-generate resume PDF"
          git push
